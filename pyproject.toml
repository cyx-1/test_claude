[project]
name = "test_claude"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1.45",
    "openai>=2.7.1",
    "pyyaml>=6.0.3",
]

# [dependency-groups] is the uv way of specifying dev dependencies, which gets picked up by uv sync
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist",
]



[tool.ruff]
line-length = 130
lint.ignore = ["E203", "E266"]
lint.select = [
    "I",  # Enable import sorting
]
lint.mccabe.max-complexity = 18
